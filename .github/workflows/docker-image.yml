# Builds the Community Edition image of this fork and publishes it on ghcr.io,
# where VPS1 pulls it (see deploy/README.md). Three stages:
#   overleaf-base:basic        server-ce/Dockerfile-base (upstream, scheme-basic)
#   overleaf-base:texlive-full deploy/Dockerfile-texlive (scheme-full on top)
#   overleaf:latest            server-ce/Dockerfile (Overleaf code)
# The base stages come from the registry cache unless their Dockerfile changes.
name: Docker image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "doc/**"
      - "deploy/compose.yaml"
      - "deploy/*.caddy"
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE: ghcr.io/vforiel/overleaf-base
  IMAGE: ghcr.io/vforiel/overleaf

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use the server-ce .dockerignore
        run: cp server-ce/.dockerignore .dockerignore

      - name: Base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-ce/Dockerfile-base
          push: true
          tags: ${{ env.BASE_IMAGE }}:basic
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:cache-basic
          cache-to: type=registry,ref=${{ env.BASE_IMAGE }}:cache-basic,mode=max

      - name: Base image with TeX Live full
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile-texlive
          push: true
          build-args: OVERLEAF_BASE_TAG=${{ env.BASE_IMAGE }}:basic
          tags: ${{ env.BASE_IMAGE }}:texlive-full
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:cache-texlive
          cache-to: type=registry,ref=${{ env.BASE_IMAGE }}:cache-texlive,mode=max

      - name: Free builder space
        run: docker buildx prune --all --force && df -h /

      # Packing the git dependency @replit/codemirror-indentation-markers builds it in /tmp, where its
      # esbuild binary must run, but BuildKit tmpfs mounts are noexec. Upstream builds find the package
      # in their warm yarn cache and never pack it; here /tmp stays a normal directory.
      - name: Build without tmpfs on /tmp
        run: sed 's|--mount=type=tmpfs,target=/tmp ||' server-ce/Dockerfile > server-ce/Dockerfile.fork

      - name: Community image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-ce/Dockerfile.fork
          push: true
          build-args: OVERLEAF_BASE_TAG=${{ env.BASE_IMAGE }}:texlive-full
          labels: com.overleaf.ce.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=min
